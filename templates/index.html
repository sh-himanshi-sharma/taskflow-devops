<!DOCTYPE html>
<html>
<head>
    <title>TaskFlow - Task Manager</title>
</head>
<body>
    <h1>TaskFlow</h1>
    <h2>My Task Management Application</h2>

    <form action="/add" method="POST">
        <input type="text" name="title"
               placeholder="Enter a task" required>
        <button type="submit">Add Task</button>
    </form>

    <h3>My Tasks</h3>

    <ul>
        {% for task in tasks %}
        <li>
            {{ task.title }}
            <a href="/delete/{{ task.id }}">Delete</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
